<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Phase Runner</title>
  
  <!-- Mobile-friendly -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  
  <style>
  body {
    margin: 0;
    background: radial-gradient(circle at top, #0a0f2c, #000);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    font-family: Arial, sans-serif;
    
  }
  
  /* Game container (mobile-first) */
  #game-container {
    width: 360px;
    height: 640px;
    background: linear-gradient(180deg, #050a1a, #02040d);
    border-radius: 16px;
   
    inset 0 0 30px rgba(0, 246, 255, 0.08);
    border: 2px solid rgba(0, 246, 255, 0.8);
    position: relative;
    
  }
  
  canvas {
    display: block;
    border-radius: 16px;
    background:
    radial-gradient(circle at center, rgba(0, 246, 255, 0.05), transparent 70%),
    #050510;
    
  }
</style>

</head>
<body>
  
  
  <div id="game-container">
    <canvas id="gameCanvas" width="360" height="640"></canvas>
    </div>

</body>
<script src="game.js"></script>

</html>
